name: Restore profile photo
on:
  push:
    paths:
      - '.github/workflows/restore-photo.yml'
permissions:
  contents: write
jobs:
  restore-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore LaMarco profile photo
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          s, n = re.subn(r'<img src="data:image/jpeg;base64,[^"]+" alt="LaMarco Collins" class="profile-image">', '<img src="profile.jpg" alt="LaMarco Collins" class="profile-image">', s, count=1)
          if n != 1:
              raise SystemExit('Expected profile image tag was not found exactly once')
          p.write_text(s)
          PY
      - name: Commit restored photo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore LaMarco profile photo" || exit 0
          git push
